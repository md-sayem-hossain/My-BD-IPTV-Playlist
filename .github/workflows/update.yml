name: Update IPTV Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "channels.m3u"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build playlist
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building IPTV Playlist"
          echo "======================================"

          if [ ! -f "channels.m3u" ]; then
            echo "ERROR: channels.m3u not found!"
            exit 1
          fi

          if ! grep -q "^#EXTM3U" channels.m3u; then
            echo "ERROR: Invalid M3U file!"
            exit 1
          fi

          CHANNELS=$(grep -c "^#EXTINF:" channels.m3u || true)

          if [ "$CHANNELS" -eq 0 ]; then
            echo "ERROR: No channels found!"
            exit 1
          fi

          cp channels.m3u playlist.m3u

          echo "Channels: $CHANNELS"
          echo "Playlist: playlist.m3u"

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Update IPTV playlist"
            git push
          fi