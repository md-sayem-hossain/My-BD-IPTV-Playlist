name: Check IPTV Playlist

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Automatically check after manually changing channels.m3u
  push:
    branches:
      - main
    paths:
      - "channels.m3u"

permissions:
  contents: write

jobs:
  check-playlist:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Download repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6


      # ----------------------------------------
      # 2. Check channels
      # ----------------------------------------
      - name: Check IPTV channels
        shell: bash
        run: |

          set -u

          INPUT_FILE="channels.m3u"
          OUTPUT_FILE="playlist.m3u"
          TEMP_FILE="playlist.tmp.m3u"

          rm -f "$TEMP_FILE"

          echo "#EXTM3U" > "$TEMP_FILE"

          TOTAL=0
          WORKING=0
          FAILED=0

          echo ""
          echo "=========================================="
          echo "        IPTV CHANNEL HEALTH CHECK"
          echo "=========================================="
          echo ""


          # ----------------------------------------
          # Read channels.m3u
          # ----------------------------------------

          while IFS= read -r line || [ -n "$line" ]; do

            # Ignore empty lines
            [[ -z "$line" ]] && continue

            # Ignore #EXTM3U
            [[ "$line" == "#EXTM3U" ]] && continue

            # Ignore other comments
            [[ "$line" == "#"* && "$line" != "#EXTINF"* ]] && continue


            # ----------------------------------------
            # Found channel metadata
            # ----------------------------------------

            if [[ "$line" == "#EXTINF"* ]]; then

              EXTINF="$line"

              # Read stream URL
              IFS= read -r URL || true

              [[ -z "$URL" ]] && continue

              # Ignore comments
              [[ "$URL" == "#"* ]] && continue


              TOTAL=$((TOTAL + 1))


              # Get channel name
              CHANNEL_NAME="${EXTINF##*,}"


              echo "------------------------------------------"
              echo "Channel : $CHANNEL_NAME"
              echo "Checking..."


              # ----------------------------------------
              # Test stream
              # ----------------------------------------

              if curl \
                --location \
                --silent \
                --show-error \
                --max-time 20 \
                --connect-timeout 10 \
                --retry 1 \
                --range 0-4095 \
                "$URL" \
                -o /dev/null
              then

                echo "Status  : ONLINE"

                echo "$EXTINF" >> "$TEMP_FILE"
                echo "$URL" >> "$TEMP_FILE"
                echo "" >> "$TEMP_FILE"

                WORKING=$((WORKING + 1))

              else

                echo "Status  : OFFLINE"

                FAILED=$((FAILED + 1))

              fi

            fi

          done < "$INPUT_FILE"


          # ----------------------------------------
          # Summary
          # ----------------------------------------

          echo ""
          echo "=========================================="
          echo "             CHECK COMPLETE"
          echo "=========================================="

          echo "Total channels : $TOTAL"
          echo "Working        : $WORKING"
          echo "Offline        : $FAILED"

          echo "=========================================="
          echo ""


          # ----------------------------------------
          # Safety checks
          # ----------------------------------------

          if [ "$TOTAL" -eq 0 ]; then

            echo "ERROR: No channels found."
            rm -f "$TEMP_FILE"
            exit 1

          fi


          # Never destroy a working playlist
          # if every channel suddenly fails.

          if [ "$WORKING" -eq 0 ]; then

            echo "ERROR: No working channels detected."
            echo "Keeping previous playlist."

            rm -f "$TEMP_FILE"

            exit 1

          fi


          # ----------------------------------------
          # Replace public playlist
          # ----------------------------------------

          mv "$TEMP_FILE" "$OUTPUT_FILE"

          echo "playlist.m3u generated successfully."


      # ----------------------------------------
      # 3. Commit generated playlist
      # ----------------------------------------
      - name: Commit updated playlist
        shell: bash
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add playlist.m3u


          if git diff --cached --quiet; then

            echo "No playlist changes detected."

          else

            git commit -m "Auto update IPTV playlist"

            git push

            echo "Playlist updated successfully."

          fi