name: Update IPTV Playlist

on:
  schedule:
    # Update every 6 hours
    - cron: "0 */6 * * *"

  # Allow manual update
  workflow_dispatch:

  # Update when sources.txt changes
  push:
    branches:
      - main
    paths:
      - "sources.txt"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # 2. Download playlist
      # ==========================================
      - name: Download IPTV playlist
        shell: bash
        run: |
          set -e

          TEMP_FILE="playlist.tmp.m3u"

          rm -f "$TEMP_FILE"

          echo "Downloading IPTV playlist..."

          while IFS= read -r URL || [ -n "$URL" ]; do

            # Skip empty lines
            [[ -z "$URL" ]] && continue

            # Skip comments
            [[ "$URL" =~ ^# ]] && continue

            echo "Source: $URL"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --max-time 120 \
              --retry 3 \
              --retry-delay 5 \
              "$URL" >> "$TEMP_FILE"

            echo "" >> "$TEMP_FILE"

          done < sources.txt

          # ==========================================
          # Validate downloaded playlist
          # ==========================================

          if [ ! -s "$TEMP_FILE" ]; then
            echo "ERROR: Downloaded playlist is empty."
            rm -f "$TEMP_FILE"
            exit 1
          fi

          if ! grep -q "#EXTM3U" "$TEMP_FILE"; then
            echo "ERROR: Downloaded file is not a valid M3U playlist."
            rm -f "$TEMP_FILE"
            exit 1
          fi

          # ==========================================
          # Count channels
          # ==========================================

          CHANNEL_COUNT=$(grep -c "^#EXTINF" "$TEMP_FILE" || true)

          echo "=========================================="
          echo "Playlist downloaded successfully"
          echo "Channels found: $CHANNEL_COUNT"
          echo "=========================================="

          # ==========================================
          # Only replace playlist after validation
          # ==========================================

          mv "$TEMP_FILE" playlist.m3u

      # ==========================================
      # 3. Commit changes
      # ==========================================
      - name: Commit updated playlist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "Auto update IPTV playlist"
            git push

            echo "Playlist updated successfully."
          fi